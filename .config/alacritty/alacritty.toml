[colors.bright]
black = "#444b6a"
blue = "#7da6ff"
cyan = "#0db9d7"
green = "#b9f27c"
magenta = "#bb9af7"
red = "#ff7a93"
white = "#acb0d0"
yellow = "#ff9e64"

[colors.normal]
black = "#32344a"
blue = "#7aa2f7"
cyan = "#449dab"
green = "#9ece6a"
magenta = "#ad8ee6"
red = "#f7768e"
white = "#9699a8"
yellow = "#e0af68"

[colors.primary]
background = "#1a1b26"
# background = "#0a0a0a"
foreground = "#a9b1d6"

[font]
size = 12

[font.normal]
family = "JetBrainsMonoNerdFont"
style = "Regular"
# family = "Lotion"
# style = "Bold"

[window]
opacity = 0.9

[env]
TERM = "alacritty"

